# 桌面应用的构建入口（Wails v3 用 go-task 驱动，取代了 v2 的 wails.json + builder）。
#
# 常用：
#   wails3 task build                    当前平台，开发构建
#   wails3 task build APP_NAME=智开       换产物名（品牌打包用，见 scripts/build-desktop.sh）
#   wails3 task package                  出安装包
#   wails3 task run                       构建并运行
#   wails3 task --list                    看全部任务
#
# 只保留 windows / darwin 两个平台的 include。模板默认还带 linux / ios / android，
# 但那些资产没搬进仓库——include 一个不存在的 Taskfile 会让 task 直接解析失败，
# 所以要跟着裁。将来要支持 Linux，先 `wails3 generate build-assets` 生成
# build/linux/ 再把 include 加回来。
version: '3'

vars:
  # APP_NAME 决定产物文件名。品牌打包时由命令行覆盖：
  #   wails3 task build APP_NAME=智开
  APP_NAME: "XRUN"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # 目标平台默认取宿主 OS。Wails 不能交叉编译（三平台 WebView 各不相同），
  # 所以这里基本只会是宿主自己。
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: 构建应用
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: 打出可分发的安装包
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: 构建并运行
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: 开发模式（前端热更新 + Go 侧重建）
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
