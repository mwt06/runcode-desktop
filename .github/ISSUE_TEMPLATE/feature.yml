name: Feature request
description: Suggest an idea for runcode
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. For larger features, please describe the problem first.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should runcode do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: milestone
    attributes:
      label: Suggested milestone
      options:
        - v0.1 MVP
        - v0.2
        - v0.3
        - v0.4
        - v1.0
        - later / not sure
