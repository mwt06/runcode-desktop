name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# go.work exists for local development only; CI builds each module through the
# go.mod replace chain so the workspace file can never mask a broken module.
env:
  GOWORK: off

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: golangci-lint (engine)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          working-directory: engine

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Test (root module)
        run: go test -race ./...

      - name: Test (engine module)
        run: go -C engine test -race ./...

  build:
    name: Snapshot build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Build (engine module)
        run: go -C engine build ./...

      - name: Build
        run: go build ./cmd/runcode

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean

  deps:
    name: Dependency direction audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      # The engine module must never import the root module: ports are defined
      # in the engine, implementations live in the shells.
      - name: Engine must not depend on root module
        run: |
          bad=$(go -C engine list -deps ./... | grep 'wt68/runcode' | grep -v 'wt68/runcode/engine' || true)
          if [ -n "$bad" ]; then
            echo "engine module depends on root module packages:" >&2
            echo "$bad" >&2
            exit 1
          fi

  protocol:
    name: Protocol drift gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cmd/runcode-desktop/frontend/package-lock.json

      # engine/protocol must stay stdlib-only: the structural guarantee that
      # engine-internal types cannot leak onto the wire.
      # A dot in an import path means an external module domain; stdlib paths
      # never contain one.
      - name: Protocol package is stdlib-only
        run: |
          bad=$(go -C engine list -f '{{join .Imports "\n"}}' ./protocol | grep '\.' || true)
          if [ -n "$bad" ]; then
            echo "engine/protocol imports non-stdlib packages:" >&2
            echo "$bad" >&2
            exit 1
          fi

      # Generated TS must match the committed files, and the command registry
      # must match desktop.App's exported methods (protogen checks both).
      - name: Generated protocol is fresh
        run: go run ./tools/protogen --check

      - name: Frontend typecheck
        working-directory: cmd/runcode-desktop/frontend
        run: |
          npm ci
          npm run typecheck
