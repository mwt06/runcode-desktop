name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# go.work exists for local development only; CI builds each module through the
# go.mod replace chain so the workspace file can never mask a broken module.
#
# TODO(agentloop fetch): the engine is required as a tagged module
# (gitlab.ouc-online.com.cn/aibase/agentloop, no replace) and resolves via
# GOPRIVATE + git credentials with network reach to the internal GitLab.
# GitHub-hosted runners cannot reach that intranet host, so these jobs cannot
# resolve the engine module here — the likely endgame is moving this repo's CI
# to the internal GitLab (where a runner and CI config already exist for the
# engine repo).
env:
  GOWORK: off

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Test (root module)
        run: go test -race ./...

      # The server skeleton's own test suite includes the dependency audit
      # proving it only imports the engine module's (agentloop's) public surface.
      - name: Test (server skeleton)
        run: go -C cmd/runcode-server test -race ./...

  build:
    name: Snapshot build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Build (server skeleton)
        run: go -C cmd/runcode-server build ./...

      - name: Build
        run: go build ./cmd/runcode

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean

  protocol:
    name: Protocol drift gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cmd/runcode-desktop/frontend/package-lock.json

      # Generated TS must match the committed files, and the command registry
      # must match desktop.App's exported methods (protogen checks both).
      - name: Generated protocol is fresh
        run: go run ./tools/protogen --check

      - name: Frontend typecheck
        working-directory: cmd/runcode-desktop/frontend
        run: |
          npm ci
          npm run typecheck
