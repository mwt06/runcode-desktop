name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# go.work exists for local development only; CI builds each module through the
# go.mod replace chain so the workspace file can never mask a broken module.
#
# 引擎（agentloop）是独立的私有仓库。CI 上既不能靠 go.work（那指着本地才有的同级
# 目录），也不能按 go.mod 的 gitlab 路径去拉（GitHub 的机器够不着内网）——2026-07-20
# 起这里全红一个半月就是这么来的。现在引擎在 GitHub 上，由 .github/actions/setup-engine
# 取出并 replace 过去，那个 action 里写了为什么这样接。
#
# 它需要仓库 secret ENGINE_REPO_TOKEN：一个对 mwt06/agentloop 有读权限的令牌。
# GITHUB_TOKEN 不行，它的权限只覆盖当前仓库。
env:
  # 必须带引号：YAML 会把裸 off 解析成布尔假，环境变量于是变成 "false"——那不是
  # GOWORK 认得的值（它只认 "off" 或一个 go.work 路径），等于这行白写。
  GOWORK: "off"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: 接上引擎
        uses: ./.github/actions/setup-engine
        with:
          token: ${{ secrets.ENGINE_REPO_TOKEN }}

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: 接上引擎
        uses: ./.github/actions/setup-engine
        with:
          token: ${{ secrets.ENGINE_REPO_TOKEN }}

      - name: Test (root module)
        run: go test -race ./...

      # The server skeleton's own test suite includes the dependency audit
      # proving it only imports the engine module's (agentloop's) public surface.
      - name: Test (server skeleton)
        run: go -C cmd/runcode-server test -race ./...

  build:
    name: Snapshot build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: 接上引擎
        uses: ./.github/actions/setup-engine
        with:
          token: ${{ secrets.ENGINE_REPO_TOKEN }}

      - name: Build (server skeleton)
        run: go -C cmd/runcode-server build ./...

      - name: Build
        run: go build ./cmd/runcode

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean

  protocol:
    name: Protocol drift gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: 接上引擎
        uses: ./.github/actions/setup-engine
        with:
          token: ${{ secrets.ENGINE_REPO_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cmd/runcode-desktop/frontend/package-lock.json

      # Generated TS must match the committed files, and the command registry
      # must match desktop.App's exported methods (protogen checks both).
      - name: Generated protocol is fresh
        run: go run ./tools/protogen --check

      - name: Frontend typecheck, lint and tests
        working-directory: cmd/runcode-desktop/frontend
        run: |
          npm ci
          npm run typecheck
          # eslint 在这里管 tsc 看不见的事:React hook 的依赖数组。
          npm run lint
          npm test
