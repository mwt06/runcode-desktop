name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# go.work exists for local development only; CI builds each module through the
# go.mod replace chain so the workspace file can never mask a broken module.
env:
  GOWORK: off

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: golangci-lint (root)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: golangci-lint (engine)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          working-directory: engine

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Test (root module)
        run: go test -race ./...

      - name: Test (engine module)
        run: go -C engine test -race ./...

  build:
    name: Snapshot build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Build (engine module)
        run: go -C engine build ./...

      - name: Build
        run: go build ./cmd/runcode

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: build --snapshot --clean

  deps:
    name: Dependency direction audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: '**/go.sum'

      # The engine module must never import the root module: ports are defined
      # in the engine, implementations live in the shells.
      - name: Engine must not depend on root module
        run: |
          bad=$(go -C engine list -deps ./... | grep 'wt68/runcode' | grep -v 'wt68/runcode/engine' || true)
          if [ -n "$bad" ]; then
            echo "engine module depends on root module packages:" >&2
            echo "$bad" >&2
            exit 1
          fi
