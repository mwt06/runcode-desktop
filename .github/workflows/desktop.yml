name: Desktop

# Build and package the Wails desktop app (cmd/runcode-desktop) natively on each
# platform — Wails can't cross-compile because each OS uses a different WebView
# (WebView2 on Windows, WebKitGTK on Linux, WKWebView on macOS).

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write # attach binaries to a Release on tag builds

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            build: wails build -tags webkit2_41 -clean
            artifact: XRUN-linux-amd64
          - os: windows-latest
            name: windows
            build: wails build -clean
            artifact: XRUN-windows-amd64.exe
          - os: macos-latest
            name: macos
            build: wails build -platform darwin/universal -clean
            artifact: XRUN-macos.zip
    defaults:
      run:
        shell: bash
        working-directory: cmd/runcode-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cmd/runcode-desktop/frontend/package-lock.json

      - name: Install Linux WebView deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Type-check before packaging: vite build does not run tsc, so this is
      # the frontend's only type gate.
      - name: Frontend typecheck
        working-directory: cmd/runcode-desktop/frontend
        run: |
          npm ci
          npm run typecheck

      - name: Build
        run: ${{ matrix.build }}

      - name: Package
        run: |
          cd build/bin
          case "${{ matrix.name }}" in
            windows) mv XRUN.exe "${{ matrix.artifact }}" ;;
            linux)   mv XRUN "${{ matrix.artifact }}" ;;
            macos)   zip -r "${{ matrix.artifact }}" XRUN.app ;;
          esac
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XRUN-${{ matrix.name }}
          path: cmd/runcode-desktop/build/bin/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cmd/runcode-desktop/build/bin/${{ matrix.artifact }}
          # Mark tags with a pre-release suffix (e.g. v0.1.0-preview) as pre-releases
          # so they don't become the "latest" release.
          prerelease: ${{ contains(github.ref_name, '-') }}
